# =============================================================================
# Podman Compose — RAG Pipeline with Hybrid Search
# =============================================================================

services:
  # ---- API Server -----------------------------------------------------------
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #     target: runtime
  #   ports:
  #     - "8000:8000"
  #   env_file: .env.example
  #   environment:
  #     - OPENSEARCH_HOST=opensearch
  #     - OPENSEARCH_PORT=9200
  #     - POSTGRES_HOST=postgres
  #     - POSTGRES_PORT=5432
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - S3_ENDPOINT_URL=http://seaweedfs:8333
  #     - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
  #     - OTEL_SERVICE_NAME=rag-pipeline
  #   depends_on:
  #     opensearch:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #     seaweedfs:
  #       condition: service_healthy
  #   restart: unless-stopped
  #   networks:
  #     - rag-network

  # ---- OpenSearch (vector + BM25 + metadata) --------------------------------
  opensearch:
    image: opensearchproject/opensearch:3.7.0
    container_name: rag-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped
    networks:
      - rag-network

  # ---- OpenSearch Dashboards (UI) ---------------------------------------------
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.7.0
    container_name: rag-dashboards
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      - OPENSEARCH_DASHBOARDS_DATA_SOURCE_ENABLED=true
      - OPENSEARCH_DASHBOARDS_WORKSPACE_ENABLED=true
      - OPENSEARCH_DASHBOARDS_EXPLORE_ENABLED=true
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - rag-network

  # ---- PostgreSQL (document/chunk metadata) ---------------------------------
  postgres:
    image: postgres:16
    container_name: rag-postgres
    environment:
      POSTGRES_DB: rag_pipeline
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_dev_password}
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag_pipeline"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - rag-network

  # ---- Redis (caching layer) ------------------------------------------------
  redis:
    image: redis:7
    container_name: rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    networks:
      - rag-network


  # ---- SeaweedFS (raw file storage) -----------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:4.39
    container_name: rag-seaweedfs
    command: "server -s3 -master.volumeSizeLimitMB=100"
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8888:8888"
      - "8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ---- Prometheus (metrics collection) --------------------------------------
  prometheus:
    image: prom/prometheus:v3
    container_name: rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - rag-network

  # ---- Grafana (dashboards) -------------------------------------------------
  grafana:
    image: grafana/grafana:12.2
    container_name: rag-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    networks:
      - rag-network

  # ---- OpenTelemetry Collector (traces + metrics + logs pipeline) ------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: rag-otel-collector
    command: ["--config=/etc/otelcol/config.yml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector metrics
      - "8889:8889"   # Prometheus exporter
    volumes:
      - ./config/otel-collector-config.yml:/etc/otelcol/config.yml:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    networks:
      - rag-network

  # ---- Loki (log aggregation) ------------------------------------------------
  loki:
    image: grafana/loki:3.4.2
    container_name: rag-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

  # ---- Tempo (distributed tracing) -------------------------------------------
  tempo:
    image: grafana/tempo:2.7.1
    container_name: rag-tempo
    ports:
      - "3200:3200"   # Tempo HTTP
      - "4317"        # OTLP gRPC (internal)
    volumes:
      - ./config/tempo-config.yml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo
    command: -config.file=/etc/tempo/config.yaml
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  opensearch-data:
  postgres-data:
  redis-data:
  prometheus-data:
  seaweedfs-data:
  grafana-data:
  loki-data:
  tempo-data:

networks:
  rag-network:
    driver: bridge
