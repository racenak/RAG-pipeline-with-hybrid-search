[project]
name = "rag-pipeline-with-hybrid-search"
version = "0.1.0"
description = "Production-grade RAG pipeline with hybrid search (vector + BM25 + RRF + reranking)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    # --- Configuration ---
    "pyyaml>=6,<7",
    # --- Data pipeline: parsing ---
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "pandas>=2.2,<3",
    # --- URL ingestion (Firecrawl) ---
    "firecrawl-py>=1.0,<2",
    # --- Data pipeline: tokenization ---
    "tiktoken>=0.7,<1",
    # --- Embeddings ---
    "sentence-transformers>=3.0,<4",
    "openai>=1.30,<2",
    # --- Retrieval ---
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8,<2",
    # --- Storage ---
    "psycopg2-binary>=2.9,<3",
    "redis>=5.0,<6",
    # --- Orchestration ---
    # --- Observability ---
    "structlog>=24.1,<25",
    "opentelemetry-api>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "prometheus-client>=0.20,<1",
    "beautifulsoup4>=4.15.0",
    "ftfy>=6.1,<7",
    "tiktoken>=0.8,<1",
    "opensearch-py>=3.2.0",
]

[project.optional-dependencies]
dev = [
    # --- Linting & formatting ---
    "ruff>=0.5,<1",

    # --- Type checking ---
    "mypy>=1.10,<2",
    "types-pyyaml",

    # --- Testing ---
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.23,<1",
    "pytest-mock>=3.14,<4",

    # --- Pre-commit ---
    "pre-commit>=3.7,<4",
]

[project.urls]
Repository = "https://github.com/vu/RAG-pipeline-with-hybrid-search"

[project.scripts]
rag-pipeline = "rag_pipeline.api.app:main"

# =============================================================================
# Build system
# =============================================================================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_pipeline"]

# =============================================================================
# Ruff — linter + formatter
# =============================================================================

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific
]
ignore = [
    "E501",    # line too long (formatter handles this)
    "B008",    # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SLF001"]  # private member access is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["rag_pipeline"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# =============================================================================
# Mypy — type checking
# =============================================================================

[tool.mypy]
python_version = "3.11"
packages = ["rag_pipeline"]
mypy_path = "src"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "faiss.*",
    "pdfplumber.*",
    "rank_bm25.*",
    "prometheus_client.*",
    "redis.*",
]
ignore_missing_imports = true

# =============================================================================
# Pytest — testing
# =============================================================================

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests (no external deps)",
    "integration: Integration tests (require services)",
    "slow: Slow tests (> 5s)",
    "evaluation: Evaluation tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

# =============================================================================
# Coverage
# =============================================================================

[tool.coverage.run]
source = ["rag_pipeline"]
omit = [
    "tests/*",
    "evaluation/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]

[tool.coverage.html]
directory = "htmlcov"
